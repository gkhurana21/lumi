<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
      .local{fill:#ecfdf5;stroke:#10b981;stroke-width:1.3}
      .cloud{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.3}
      .core{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5}
      .t{fill:#0f172a;font-weight:600}
      .s{fill:#475569;font-size:11px}
      .h{fill:#0f172a;font-size:13.5px;font-weight:700}
      .l{fill:#64748b;font-size:10.5px}
      .e{stroke:#4b5563;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#3b82f6;stroke-width:1.4;fill:none;marker-end:url(#a);stroke-dasharray:5 3}
    </style>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>

  <!-- browser -->
  <rect class="zone" x="14" y="40" width="200" height="440" rx="12"/>
  <text class="h" x="28" y="64">Browser (I/O only)</text>
  <rect class="box" x="28" y="80" width="172" height="48" rx="8"/><text class="t" x="40" y="100">Camera</text><text class="s" x="40" y="117">640x480 JPEG, 5 fps</text>
  <rect class="box" x="28" y="140" width="172" height="48" rx="8"/><text class="t" x="40" y="160">Microphone</text><text class="s" x="40" y="177">PCM16 16 kHz, 20 ms</text>
  <rect class="box" x="28" y="200" width="172" height="62" rx="8"/><text class="t" x="40" y="220">Speaker</text><text class="s" x="40" y="237">voice (PCM 24 kHz),</text><text class="s" x="40" y="252">synthesized SFX + music</text>
  <rect class="box" x="28" y="274" width="172" height="78" rx="8"/><text class="t" x="40" y="294">Dashboard</text><text class="s" x="40" y="311">3D lamp from the URDF,</text><text class="s" x="40" y="326">face view, state, mood,</text><text class="s" x="40" y="341">chat, goals, memory</text>
  <text class="l" x="28" y="380">Echo cancellation, capture,</text><text class="l" x="28" y="394">playback live here, so the</text><text class="l" x="28" y="408">server needs no audio or</text><text class="l" x="28" y="422">camera drivers.</text>

  <!-- websocket -->
  <line class="e" x1="214" y1="170" x2="256" y2="170"/>
  <line class="e" x1="256" y1="250" x2="214" y2="250"/>
  <text class="l" transform="translate(232 440) rotate(-90)">one WebSocket</text>
  <text class="l" transform="translate(246 440) rotate(-90)">binary + JSON</text>

  <!-- server -->
  <rect class="zone" x="258" y="40" width="540" height="440" rx="12"/>
  <text class="h" x="272" y="64">Python server: every behavioral decision</text>

  <rect class="local" x="272" y="80" width="168" height="58" rx="8"/><text class="t" x="284" y="100">Attention (local)</text><text class="s" x="284" y="116">MediaPipe face, nose-offset</text><text class="s" x="284" y="130">gaze, hysteresis, debounce</text>
  <rect class="local" x="272" y="150" width="168" height="58" rx="8"/><text class="t" x="284" y="170">Speech turns (local)</text><text class="s" x="284" y="186">webrtcvad + noise floor</text><text class="s" x="284" y="200">+ harmonic gate, echo guard</text>

  <rect class="core" x="470" y="92" width="150" height="104" rx="10"/>
  <text class="t" x="482" y="114">FSM + Affect</text><text class="s" x="482" y="131">8 states, events only</text><text class="s" x="482" y="146">via Machine.fire; one</text><text class="s" x="482" y="161">side-effect handler;</text><text class="s" x="482" y="176">valence / arousal</text>
  <line class="e" x1="440" y1="109" x2="470" y2="124"/>
  <line class="e" x1="440" y1="179" x2="470" y2="166"/>

  <rect class="local" x="640" y="80" width="146" height="86" rx="8"/><text class="t" x="652" y="100">Goal executor</text><text class="s" x="652" y="116">find, aim, light,</text><text class="s" x="652" y="130">re-observe, verify,</text><text class="s" x="652" y="144">re-aim once, outcome</text><text class="s" x="652" y="158">(up to 3 targets)</text>
  <line class="e" x1="620" y1="130" x2="640" y2="125"/>

  <rect class="cloud" x="272" y="252" width="168" height="72" rx="8"/><text class="t" x="284" y="272">Dialogue + hearing</text><text class="s" x="284" y="288">one call: audio in,</text><text class="s" x="284" y="302">{heard, say, emotion,</text><text class="s" x="284" y="316">gesture, music, action}</text>
  <rect class="cloud" x="272" y="336" width="168" height="44" rx="8"/><text class="t" x="284" y="355">Voice (TTS)</text><text class="s" x="284" y="371">streamed PCM, en-GB</text>
  <rect class="cloud" x="272" y="392" width="168" height="72" rx="8"/><text class="t" x="284" y="412">Scene vision</text><text class="s" x="284" y="428">objects, locations, boxes;</text><text class="s" x="284" y="442">every 15 s and on goals</text><text class="s" x="284" y="456">-> Scene memory (Chroma)</text>
  <path class="d" d="M470,182 H456 V288 H442"/>
  <text class="l" x="458" y="232">turns</text>
  <path class="d" d="M440,452 H713 V168"/>
  <text class="l" x="630" y="446">object positions</text>

  <rect class="core" x="470" y="236" width="150" height="104" rx="10"/>
  <text class="t" x="482" y="258">Body (20 Hz)</text><text class="s" x="482" y="275">poses, gaze, gestures,</text><text class="s" x="482" y="290">dance, idle life, light;</text><text class="s" x="482" y="305">URDF soft limits and</text><text class="s" x="482" y="320">velocity limits</text>
  <line class="e" x1="545" y1="196" x2="545" y2="236"/>
  <line class="e" x1="700" y1="166" x2="610" y2="236"/>

  <!-- cloud fence -->
  <rect x="262" y="244" width="188" height="228" rx="12" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="l" x="460" y="402" fill="#1d4ed8">Google Gemini (or Claude +</text>
  <text class="l" x="460" y="416" fill="#1d4ed8">OpenAI, or offline fakes):</text>
  <text class="l" x="460" y="430" fill="#1d4ed8">words and scene descriptions</text>
  <text class="l" x="460" y="444" fill="#1d4ed8">only, behind 4 interfaces</text>

  <!-- renderers -->
  <rect class="zone" x="820" y="40" width="206" height="440" rx="12"/>
  <text class="h" x="834" y="64">Body renderers</text>
  <rect class="box" x="834" y="80" width="178" height="62" rx="8"/><text class="t" x="846" y="100">PyBullet</text><text class="s" x="846" y="117">own process, 240 Hz,</text><text class="s" x="846" y="132">URDF motor limits</text>
  <rect class="box" x="834" y="154" width="178" height="62" rx="8"/><text class="t" x="846" y="174">Browser 3D</text><text class="s" x="846" y="191">three.js + URDF, spotlight,</text><text class="s" x="846" y="206">eases 10 Hz frames</text>
  <rect x="834" y="228" width="178" height="62" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 3"/><text class="t" x="846" y="248">Real lamp</text><text class="s" x="846" y="265">motor driver on the same</text><text class="s" x="846" y="280">frames, re-applies limits</text>
  <line class="e" x1="620" y1="270" x2="834" y2="111"/>
  <line class="e" x1="620" y1="290" x2="834" y2="185"/>
  <line x1="620" y1="310" x2="834" y2="259" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text class="l" x="722" y="330">joint targets</text><text class="l" x="722" y="343">+ light</text>
  <text class="l" x="834" y="320">Body produces targets;</text><text class="l" x="834" y="334">renderers only render.</text>

  <!-- footer -->
  <text class="l" x="14" y="510">Green: local and offline-capable. Blue dashed: cloud. Amber: the decision core. Engagement, greeting, listening, interrupting, goals, and sleep never wait on the network.</text>
  <text class="l" x="14" y="528">Measured: engagement 387 ms; end of speech to first audio 1.50 s median (Gemini free tier); server 0.19 cores, 370 MB under load.</text>
  <text class="h" x="14" y="26">Lumi: architecture and data flow</text>
</svg>
